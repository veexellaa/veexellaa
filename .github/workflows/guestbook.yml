# Положить в репозиторий по пути: .github/workflows/guestbook.yml
# Гостевая книга: при каждом комментарии в issue #1 обновляет таблицу в README.md
name: Guestbook

on:
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch: # ручной запуск из вкладки Actions

permissions:
  contents: write
  issues: read

concurrency:
  group: guestbook
  cancel-in-progress: false

jobs:
  update:
    # только комментарии в issue #1 (гостевая книга)
    if: github.event_name == 'workflow_dispatch' || github.event.issue.number == 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build guestbook table
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const ISSUE = 1;     // номер issue гостевой книги
            const LIMIT = 10;    // сколько последних записей показывать

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ISSUE,
              per_page: 100,
            });

            // защита от поломки таблицы и HTML-вставок
            const clean = (s) => s
              .replace(/\r?\n/g, ' ')
              .replace(/\|/g, '\\|')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .slice(0, 200);

            const rows = comments
              .filter((c) => c.user.type !== 'Bot')
              .reverse()
              .slice(0, LIMIT)
              .map((c) => {
                const u = c.user.login;
                const date = c.created_at.slice(0, 10);
                return `| <a href="https://github.com/${u}"><img width="24" src="https://github.com/${u}.png?size=24" alt="${u}" /> ${u}</a> | ${date} | ${clean(c.body)} |`;
              });

            const table = ['| Name | Date | Message |', '|---|---|---|', ...rows].join('\n');
            const readme = fs.readFileSync('README.md', 'utf8');
            const updated = readme.replace(
              /<!-- Guestbook -->[\s\S]*?<!-- \/Guestbook -->/,
              `<!-- Guestbook -->\n${table}\n<!-- /Guestbook -->`
            );
            fs.writeFileSync('README.md', updated);

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "Update guestbook" && git push)
